name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check
        run: make check
      - name: Build archive
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: caravay-audio-macos
          path: |
            dist/*.tar.gz
            dist/*.sha256
